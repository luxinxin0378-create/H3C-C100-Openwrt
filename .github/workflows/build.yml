name: H3C C100 固件构建

on:
  workflow_dispatch:
    inputs:
      version:
        description: "固件版本批次号（示例：B1）"
        required: true
        default: "B1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: h3c-c100-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出定制仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl jq zstd

      - name: 克隆 ImmortalWrt 24.10 源码
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          git clone --depth 1 https://github.com/vernesong/OpenClash.git openclash

      - name: 加入 OpenClash 插件
        working-directory: immortalwrt
        run: |
          mkdir -p package/custom
          cp -a ../openclash/luci-app-openclash package/custom/

      - name: 加入 QModem feed
        working-directory: immortalwrt
        run: |
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: 配置 feeds 与包选择
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p qmodem qmodem luci-app-qmodem-next
          mkdir -p files/etc/openclash/core
          while IFS= read -r pkg; do
            pkg="${pkg%%#*}"
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done < ../config/package-list.txt
          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_PACKAGE_kmod-r8168=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          EOF
          make defconfig

      - name: 预置 Mihomo Meta 内核
        run: |
          chmod +x scripts/stage-mihomo-core.sh
          scripts/stage-mihomo-core.sh immortalwrt/files/etc/openclash/core

      - name: 注入调优与短信自愈脚本
        run: |
          mkdir -p immortalwrt/files/etc/sysctl.d immortalwrt/files/etc/uci-defaults
          cat > immortalwrt/files/etc/sysctl.d/91-proxy-tuning.conf <<'PROXYTUNE'
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 131072 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          net.netfilter.nf_conntrack_max = 65536
          PROXYTUNE
          cat > immortalwrt/files/etc/uci-defaults/98-dns-cache <<'DNSCACHE'
          uci -q set dhcp.@dnsmasq[0].cachesize='2000'
          uci -q commit dhcp
          DNSCACHE
          cat > immortalwrt/files/etc/uci-defaults/94-smsf-apitype <<'SMSF'
          #!/bin/sh
          [ -f /etc/config/sms_forwarder ] || exit 0
          i=0
          while uci -q get "sms_forwarder.@sms_forward_instance[$i]" >/dev/null 2>&1; do
            s="sms_forwarder.@sms_forward_instance[$i]"
            if [ "$(uci -q get "$s.enable")" = "1" ] && [ -z "$(uci -q get "$s.api_type")" ]; then
              ac=$(uci -q get "$s.api_config")
              t=""
              case "$ac" in
                *'"bot_token"'*)     t=tgbot ;;
                *'"pushkey"'*)       t=pushdeer ;;
                *'"recipient_uri"'*) t=sip ;;
                *open.feishu.cn*)    t=feishu ;;
                *'"token"'*)         t=serverchan ;;
                *'"webhook_url"'*)   t=webhook ;;
              esac
              [ -n "$t" ] && uci set "$s.api_type=$t"
            fi
            i=$((i+1))
          done
          uci commit sms_forwarder
          exit 0
          SMSF
          cat > immortalwrt/files/etc/uci-defaults/99-lan-root <<'LANROOT'
          #!/bin/sh
          # LAN IP 固定为 192.168.2.1
          uci -q set network.lan.ipaddr='192.168.2.1'
          uci -q commit network
          # root 密码固定为 root（chpasswd 优先，busybox passwd 管道兜底）
          echo 'root:root' | chpasswd >/dev/null 2>&1 || printf 'root\nroot\n' | passwd root >/dev/null 2>&1
          LANROOT
          chmod +x immortalwrt/files/etc/uci-defaults/99-lan-root

      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/hostedtoolcache/go || true
          df -h /

      - name: 下载源码
        working-directory: immortalwrt
        run: make download -j8

      - name: 编译固件
        working-directory: immortalwrt
        run: |
          make -j$(nproc) 2>&1 | tee build.log || true
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "::warning::并行编译失败（exit $RC），改用单线程 V=s 重试定位错误"
            make -j1 V=s 2>&1 | tee -a build.log || true
            RC=${PIPESTATUS[0]}
          fi
          exit $RC

      - name: 收集镜像
        id: collect
        run: |
          echo "===== 磁盘与编译产物诊断 ====="
          df -h / || true
          ls -la immortalwrt/bin/targets/x86/64/ 2>/dev/null || echo "(bin/targets/x86/64 不存在)"
          mkdir -p release
          find immortalwrt/bin/targets -type f \( -name '*combined-efi*' -o -name '*rootfs*' -o -name '*.manifest' \) -exec cp -v {} release/ \;
          # EFI 镜像缺失时回退 BIOS combined 镜像（Z8350 兼容 Legacy 启动）
          if [ -z "$(find release -type f -name '*combined-efi*' -print -quit)" ]; then
            echo "::warning::未找到 combined-efi 镜像，回退 BIOS combined 镜像"
            find immortalwrt/bin/targets -type f -name '*combined*' -exec cp -v {} release/ \;
          fi
          test -n "$(find release -type f -name '*combined*' -print -quit)"
          DATE="$(date -u +'%Y%m%d-%H%M')"
          VERSION="${{ github.event.inputs.version || 'B1' }}"
          TAG="C100-${VERSION}-${DATE}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "vername=${VERSION}-${DATE}" >> "$GITHUB_OUTPUT"
          sha256sum release/* > release/SHA256SUMS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: H3C-C100-${{ steps.collect.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传完整编译日志（失败排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H3C-C100-build-log
          path: immortalwrt/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: 正式版 C100 ${{ steps.collect.outputs.vername }}
          body: |
            H3C C100 专用 x86_64 UEFI 固件（ImmortalWrt 24.10，Intel Atom x5-Z8350，2GB RAM）。
            NAS：Samba4 / NFS / WSDD2 / USB-UAS / ext4-exFAT-NTFS3 / SMART / FileBrowser / Syncthing / Aria2。
            蜂窝：QModem + RM500Q-GL (5G) / EC20 (4G) + 短信转发器（含 api_type 开机自愈）。
            代理：OpenClash + Mihomo Meta AMD64 v1（预置）+ BBR + 代理调优 + DNS 缓存。
            脚本环境：bash / curl / jq / python3 / htop / coreutils。
            刷写前请确认 eMMC 分区、UEFI 启动、Realtek 网卡与 NAS 服务状态。
          files: release/*
