name: H3C C100 firmware build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version suffix (example: B1)"
        required: true
        default: "B1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: h3c-c100-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl jq zstd

      - name: Clone ImmortalWrt 24.10
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          git clone --depth 1 https://github.com/vernesong/OpenClash.git openclash

      - name: Add OpenClash package
        working-directory: immortalwrt
        run: |
          mkdir -p package/custom
          cp -a ../openclash/luci-app-openclash package/custom/

      - name: Add QModem feed
        working-directory: immortalwrt
        run: |
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: Configure feeds and package selection
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p qmodem qmodem luci-app-qmodem-next
          mkdir -p files/etc/openclash/core
          while IFS= read -r pkg; do
            pkg="${pkg%%#*}"
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done < ../config/package-list.txt
          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_PACKAGE_kmod-r8168=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          EOF
          make defconfig

      - name: Stage Mihomo Meta core
        run: |
          chmod +x scripts/stage-mihomo-core.sh
          scripts/stage-mihomo-core.sh immortalwrt/files/etc/openclash/core

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect images
        id: collect
        run: |
          mkdir -p release
          find immortalwrt/bin/targets/x86/64 -maxdepth 1 -type f \( -name '*combined-efi*' -o -name '*rootfs*' -o -name '*.manifest' \) -exec cp -v {} release/ \\;
          test -n "$(find release -type f -name '*combined-efi*' -print -quit)"
          DATE="$(date -u +'%Y%m%d-%H%M')"
          VERSION="${{ github.event.inputs.version || 'B1' }}"
          TAG="C100-${VERSION}-${DATE}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          sha256sum release/* > release/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H3C-C100-${{ steps.collect.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: H3C C100 ${{ steps.collect.outputs.tag }}
          body: |
            Automated generic x86_64 UEFI build for H3C C100.
            Verify eMMC partitioning, UEFI boot, Realtek NIC, NAS services and OpenClash core before installation.
          files: release/*
