name: 配置诊断（libustream 冲突排查）

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出定制仓库
        uses: actions/checkout@v4

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl jq zstd

      - name: 克隆源码与 OpenClash
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          git clone --depth 1 https://github.com/vernesong/OpenClash.git openclash

      - name: 加入插件与 QModem feed
        working-directory: immortalwrt
        run: |
          mkdir -p package/custom
          cp -r ../openclash/package/* package/custom/ 2>/dev/null || true
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: 更新 feeds 并按主流程写配置
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p qmodem qmodem luci-app-qmodem-next
          while IFS= read -r pkg; do
            pkg="${pkg%%#*}"
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done < ../config/package-list.txt
          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_PACKAGE_kmod-r8168=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          # libustream 冲突实验：只保留 openssl 实现
          # CONFIG_PACKAGE_libustream-mbedtls is not set
          # CONFIG_PACKAGE_libustream-wolfssl is not set
          CONFIG_PACKAGE_libustream-openssl=y
          EOF
          make defconfig
          echo "===== unset 实验结果：defconfig 后 mbedtls 状态 ====="
          grep -E "ustream" .config || echo "(无 ustream 行)" 

      - name: 诊断一：defconfig 后的 libustream 选择
        working-directory: immortalwrt
        run: |
          echo "===== .config 中 ustream 相关行 ====="
          grep -n "ustream" .config || echo "(无)"
          echo ""
          echo "===== mbedtls / openssl 实现与 default variant ====="
          grep -E "mbedtls20201210|openssl20201210|libustream-default|LIBUSTREAM" .config || echo "(无)"

      - name: 诊断二：反查依赖者
        working-directory: immortalwrt
        run: |
          echo "===== 硬依赖 libustream-mbedtls20201210 的 Makefile ====="
          grep -rln "libustream-mbedtls" package/ feeds/ target/ --include=Makefile 2>/dev/null | grep -v "ustream-ssl/Makefile" | head -30
          echo ""
          echo "===== 上述文件中的 DEPENDS 行 ====="
          grep -rn "libustream-mbedtls" package/ feeds/ target/ --include=Makefile 2>/dev/null | grep -v "ustream-ssl/Makefile" | head -40
          echo ""
          echo "===== 依赖虚拟 libustream-ssl 的包（DEPENDS 引用） ====="
          grep -rn "libustream-ssl" package/ feeds/ target/ --include=Makefile 2>/dev/null | grep -vE "libustream-(mbedtls|openssl|wolfssl)" | head -40

      - name: 诊断三：default variant 定义位置
        working-directory: immortalwrt
        run: |
          for f in $(find package feeds -path "*libustream*/Makefile" 2>/dev/null | head -5); do
            echo "===== $f ====="
            grep -nE "DEFAULT_VARIANT|LIBUSTREAM_DEFAULT|PROVIDES|define Package" "$f" | head -20
          done
